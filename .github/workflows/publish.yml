name: Release Docs

on:
  push:
    branches:
      - development

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: config/pnpm-lock.yaml
      - name: Check whether the package version is already published
        id: version
        run: |
          package_version=$(node -p "require('./package.json').version")
          if npm view "@terra-symposium/docs@${package_version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm install --frozen-lockfile
        if: steps.version.outputs.published != 'true'
      - name: Run full repository quality
        run: pnpm run quality
        if: steps.version.outputs.published != 'true'
      - run: pnpm run build
        if: steps.version.outputs.published != 'true'
      - run: npm --version && npm publish --access public --loglevel verbose
        if: steps.version.outputs.published != 'true'
