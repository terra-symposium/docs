name: Release Docs

on:
  push:
    branches:
      - development

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: config/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: changesets/action@v2
        with:
          version-script: pnpm exec changeset version
          publish-script: pnpm exec changeset publish
          commit-message: 'chore: release Docs'
          pr-title: 'chore: release Docs'
          pr-base-branch: development
          github-token: ${{ secrets.GITHUB_TOKEN }}
