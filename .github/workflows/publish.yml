name: Release Docs

on:
  push:
    branches:
      - development

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: config/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: npm --version && npm publish --access public --loglevel verbose
